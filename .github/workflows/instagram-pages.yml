name: Update Instagram and deploy Golden Alchemy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/sync_instagram.py', 'scripts/sync_recalls.py', 'scripts/sync_weather.py', 'scripts/sync_library.py', 'content/library-catalog.json', '.github/workflows/instagram-pages.yml']
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: golden-alchemy-pages
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -n "$META_PAGE_ACCESS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Instagram sync is waiting for the META_PAGE_ACCESS_TOKEN repository secret."
          fi
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    needs: credentials
    if: needs.credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Golden Alchemy Instagram posts
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: python scripts/sync_instagram.py
      - name: Refresh official FDA food-enforcement preview
        run: python scripts/sync_recalls.py
      - name: Refresh National Weather Service city forecasts
        run: python scripts/sync_weather.py
      - name: Refresh elemental article library
        run: python scripts/sync_library.py
      - name: Preserve collected article links in the Golden Alchemy repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/library-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive elemental article links [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy verified public content
        id: deployment
        uses: actions/deploy-pages@v4
